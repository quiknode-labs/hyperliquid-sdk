syntax = "proto3";

package hyperliquid;

option go_package = "github.com/quiknode-labs/hyperliquid-sdk/go/hyperliquid/proto";

service Streaming {
  // Bi-directional streaming
  rpc StreamData (stream SubscribeRequest) returns (stream SubscribeUpdate);
  rpc StreamDataBytes (stream SubscribeRequest) returns (stream SubscribeBytesUpdate);
  rpc Ping (PingRequest) returns (PingResponse);
}

service BlockStreaming {
  // Stream replica_cmds (raw blocks)
  rpc StreamBlocks (Timestamp) returns (stream Block);
}


// --- Requests ---

message SubscribeRequest {
  oneof request {
    StreamSubscribe subscribe = 1;
    Ping ping = 3;
  }
  reserved 2;
}

message StreamSubscribe {
  StreamType stream_type = 1;
  uint64 start_block = 2;

  // Generic filters - field name to allowed values
  // Recursively searches each event for matching field/value pairs
  // Example: {"coin": ["ETH", "BTC"], "user": ["0x123..."], "type": ["deposit"]}
  //
  // Reserved server-resolved keys (not matched against event JSON):
  //   "venue"/"deployer": select all markets of a HIP-4 outcome venue or
  //   HIP-3 dex by its name, or by its deployer address. Expanded to the
  //   venue's coin set server-side; unknown venues match nothing.
  map<string, FilterValues> filters = 3;

  // Optional name for this filter
  // Allows multiple independent filters per stream (OR logic)
  string filter_name = 4;

  // Field 5 is held for per-subscription enrichment options.

  // Optional client-chosen tag echoed on every update for this stream type.
  // One tag per (connection, stream type); the latest subscribe wins.
  string subscription_id = 6;
}

// Container for filter values
message FilterValues {
  repeated string values = 1;
}

message Ping { int64 timestamp = 1; }

// --- Responses ---

message SubscribeUpdate {
  oneof update {
    StreamResponse data = 1;
    Pong pong = 2;
  }
}

message SubscribeBytesUpdate {
  oneof update {
    StreamBytesResponse data = 1;
    Pong pong = 2;
  }
}

message StreamResponse {
  uint64 block_number = 1;
  uint64 timestamp = 2; // Server ingress timestamp

  // Raw JSON data from the file (Exact replica of source)
  string data = 3;

  // Which subscription this update belongs to. Always populated by servers
  // that support it; UNKNOWN when the server predates this field.
  StreamType stream_type = 4;

  // Echo of StreamSubscribe.subscription_id for this stream type. Empty when
  // the client did not set one or the server predates this field.
  string subscription_id = 5;
}

message StreamBytesResponse {
  uint64 block_number = 1;
  uint64 timestamp = 2; // Server ingress timestamp

  // Raw payload bytes. Fast-path clients should prefer this over StreamResponse.data.
  bytes data = 3;

  // Which subscription this update belongs to (see StreamResponse.stream_type).
  StreamType stream_type = 4;

  // Echo of StreamSubscribe.subscription_id (see StreamResponse.subscription_id).
  string subscription_id = 5;
}

// --- Data Types ---

enum StreamType {
  UNKNOWN = 0;
  TRADES = 1;
  ORDERS = 2;
  BOOK_UPDATES = 3;
  TWAP = 4;
  EVENTS = 5;
  BLOCKS = 6;
  WRITER_ACTIONS = 7;
  MEMPOOL_TXS = 8; // Pre-consensus mempool transactions
  ORDER_PRIORITY = 9; // Derived order/write priority actions from mempool and confirmed replica data
  GOSSIP_PRIORITY = 10; // Derived gossip/read priority bid actions; does not measure delivery latency
}

message Block {
    string data_json = 1; 
}


message Pong { int64 timestamp = 1; }
message Timestamp { int64 timestamp = 1; }
message PingRequest { int32 count = 1; }
message PingResponse { int32 count = 1; }
